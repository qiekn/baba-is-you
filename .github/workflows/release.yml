name: build

on:
  push:
    branches: [main, remake]
    tags: ["v*"]
  pull_request:
    branches: [main, remake]
  workflow_dispatch:

# softprops/action-gh-release needs write access to create releases and upload
# assets. Repos default to read-only GITHUB_TOKEN, so opt in explicitly.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive: tar.gz
            shell: bash
            exe: Baba Is You
          - os: macos-latest
            platform: macos-arm64
            archive: tar.gz
            shell: bash
            exe: Baba Is You
          - os: windows-latest
            platform: windows-x64
            archive: zip
            shell: 'msys2 {0}'
            exe: Baba Is You.exe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang libc++-dev libc++abi-dev cmake ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev

      - name: Install macOS toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: brew install ninja

      # CLANG64 mirrors the project's local toolchain on Windows: clang +
      # libc++ + lld. Without libc++ the build fails - CMakeLists.txt
      # hardcodes -stdlib=libc++.
      - name: Install Windows toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-libc++
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build
        run: cmake --build build

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          name="baba-${GITHUB_REF_NAME//\//-}-${{ matrix.platform }}"
          stage="dist/${name}"
          mkdir -p "${stage}"
          cp "build/${{ matrix.exe }}" "${stage}/"

          # Bundle the C++ runtime libs the binary pulls from the toolchain
          # so target machines don't need a matching libc++ installed.
          # macOS ships libc++ with the OS - nothing to bundle there.
          case "${{ runner.os }}" in
            Windows)
              ldd "${stage}/${{ matrix.exe }}" \
                | awk '{print $3}' \
                | grep -i '^/clang64/' \
                | xargs -I{} cp {} "${stage}/" || true
              ;;
            Linux)
              ldd "${stage}/${{ matrix.exe }}" \
                | awk '{print $3}' \
                | grep -E 'libc\+\+|libunwind' \
                | xargs -I{} cp {} "${stage}/" || true
              ;;
          esac

          cp -r assets "${stage}/"
          cp imgui_default.ini "${stage}/"
          cp README.md "${stage}/"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "${name}.zip" "${name}")
            archive="dist/${name}.zip"
          else
            (cd dist && tar -czf "${name}.tar.gz" "${name}")
            archive="dist/${name}.tar.gz"
          fi
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.archive }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.archive }}
          generate_release_notes: true
